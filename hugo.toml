baseURL = 'https://ThunderE75.github.io'
languageCode = 'en-us'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
title = "Thunder"
siteBanner= 'images/banner.jpg'
theme = 'lightning'
enableEmoji = true

[languages]
  [languages.en]
    languageName = 'English'
    languageCode = 'en-us'
    weight = 1

  # [languages.pt]
  #   languageName = 'Português'
  #   languageCode = 'pt-br'
  #   weight = 2

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "searchindex"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]

[taxonomies]
  tag = 'tags'
  category = 'categories'

[params]
  defaultImage = "/images/favicon.svg"
  deploy_commit = ""
  deploy_ref    = ""
  deploy_time   = ""

[params.lightning]
  sidePane = true
  showSharelinks = true
  showReplyByMail = true
  countPageItems = 7
  footerCommitAndTime=true
  footerScrollToTop=true
  footerPoweredBy=false

[params.lightning.info]
  authorName="Navneet"
  authorFullName="Navneet Prakash Dubey"
  username="Thunder"
  subHeading="Computer Science Graduate from Varanasi, India"
  countryEmoji="🇮🇳"
  currentOccupation="Software Development Intern at"
  companyName="KrikalSoft"
  companyURL="https://krikal.in/"
  copyrightStartYear=2025

[params.lightning.home]
  showBio = true
  showAuthorImg = true
  showHomeBanner = false
  sidePaneTags = true
  showFeatured = true
  showRecent = true
  hideRecentWhenFeatured = true
  countRecent = 5
  showSocialLinks=true

[params.lightning.side.home]
  sidePaneSticky = false
  taxonomies = ['tags']
  countTaxonomy = 5

[params.lightning.side.single]
  sidePaneSticky = true
  showDetails = true
  showTableOfContents = true
  showAttachments = true
  showRelated = true
  countRelated = 5

[menu]
  [[menu.main]]
      name = "About"
      url = "/about"
      weight = 10

  [[menu.main]]
      name = "Resumé"
      url = "/resume"
      weight = 20

  [[menu.main]]
      name = "Posts"
      url = "/posts"
      weight = 20
  
  [[menu.main]]
    name = "Socials"
    url = "/socials"
    weight = 40


[related]
 includeNewer = true
 [[related.indices]]
  name = 'tags'
  weight = 100

[markup.goldmark.renderer]
unsafe= true